<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glowing blob gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="15" />
    </filter>
  </defs>

  <!-- The subtle organic background blob -->
  <path d="M 280 80 C 400 30, 550 50, 520 150 C 490 230, 320 230, 260 160 C 220 120, 240 100, 280 80 Z" fill="url(#glow)" filter="url(#blur)"/>
  
  <!-- Main Name -->
  <text x="50%" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="90" fill="#00E5FF" text-anchor="middle" letter-spacing="3">RITAM DAS</text>
  
  <!-- Subtitle -->
  <text x="50%" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#00E5FF" text-anchor="middle">Drone &amp; Robotics | Embedded Systems | AI</text>
</svg>
